name: Actualizar datos del observatorio

# Corre diariamente y actualiza los JSON de data/ con PageSpeed + Clarity.
on:
  schedule:
    # 09:00 UTC = 04:00 America/Bogota (diario)
    - cron: '0 9 * * *'
  workflow_dispatch: {}   # permite ejecucion manual desde la pestana Actions

# Permite al job hacer commit de los JSON generados
permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Recolectar Core Web Vitals (PageSpeed)
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: node scripts/collect-psi.mjs
        continue-on-error: true

      - name: Recolectar senales de usabilidad (Clarity)
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
        run: node scripts/collect-clarity.mjs
        continue-on-error: true

      - name: Construir recomendaciones
        run: node scripts/build-recommendations.mjs
        continue-on-error: true

      - name: Commit de datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/psi.json data/clarity.json data/recommendations.json
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "chore(data): actualizacion automatica $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
