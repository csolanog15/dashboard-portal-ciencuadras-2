name: Actualizar datos del observatorio

# Corre de lunes a viernes y actualiza los JSON de data/ con PageSpeed + Clarity.
# La hora se eligio segun el trafico real del portal (pico a las 11:00 Bogota),
# para medir el performance de laboratorio bajo carga representativa.
on:
  schedule:
    # 16:00 UTC = 11:00 America/Bogota, lunes a viernes.
    # Nota: el cron de GitHub Actions no es puntual y puede retrasarse algunos minutos.
    - cron: '0 16 * * 1-5'
  workflow_dispatch: {}   # permite ejecucion manual desde la pestana Actions

# Permite al job hacer commit de los JSON generados
permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recolectar Core Web Vitals (PageSpeed)
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: node scripts/collect-psi.mjs
        continue-on-error: true

      - name: Recolectar senales de usabilidad (Clarity)
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
        run: node scripts/collect-clarity.mjs
        continue-on-error: true

      - name: Construir recomendaciones
        run: node scripts/build-recommendations.mjs
        continue-on-error: true

      - name: Acumular historico de Core Web Vitals
        run: node scripts/build-history.mjs
        continue-on-error: true

      - name: Commit de datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/psi.json data/clarity.json data/recommendations.json data/history.json
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "chore(data): actualizacion automatica $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
