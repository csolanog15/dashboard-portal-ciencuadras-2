name: Actualizar datos del observatorio

# Actualiza los JSON de data/ con PageSpeed + Clarity.
# La hora objetivo es 11:00 America/Bogota (pico de trafico real del portal),
# para medir el performance de laboratorio bajo carga representativa.
#
# IMPORTANTE sobre la programacion:
#   - El cron nativo de GitHub Actions NO es confiable: se retrasa horas y a veces
#     omite dias enteros (cola global saturada + repos de baja actividad).
#   - Por eso el disparo PRINCIPAL y confiable es EXTERNO (cron-job.org u otro),
#     que invoca este workflow via la API de GitHub (evento workflow_dispatch)
#     todos los dias a las 11:00 Bogota.
#   - El cron de abajo queda como RESPALDO por si el disparador externo falla.
on:
  schedule:
    # 16:00 UTC = 11:00 America/Bogota, TODOS los dias (respaldo; puede retrasarse u omitirse).
    - cron: '0 16 * * *'
  workflow_dispatch: {}   # disparo manual y disparo externo confiable (cron-job.org)

# Permite al job hacer commit de los JSON generados
permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recolectar Core Web Vitals (PageSpeed)
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: node scripts/collect-psi.mjs
        continue-on-error: true

      - name: Recolectar senales de usabilidad (Clarity)
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
        run: node scripts/collect-clarity.mjs
        continue-on-error: true

      - name: Construir recomendaciones
        run: node scripts/build-recommendations.mjs
        continue-on-error: true

      - name: Acumular historico de Core Web Vitals
        run: node scripts/build-history.mjs
        continue-on-error: true

      - name: Commit de datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/psi.json data/clarity.json data/recommendations.json data/history.json
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "chore(data): actualizacion automatica $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
